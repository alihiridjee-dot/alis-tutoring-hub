# Runs the checks that were previously only run by hand.
#
# Deliberately just the two that already exist — the test suite and the
# TypeScript check. Nothing here lints, formats or deploys: a check that fails
# for a reason nobody acts on gets ignored, and an ignored red cross is worse
# than no check at all.
#
# Three checks: the TypeScript typecheck, the test suite, and the curriculum
# parsers. The last one is the reason this file earns its keep. The parsers read
# the exam boards' own PDFs, and boards reissue those: a new version, a slightly
# different table layout. A parser that starts producing 40 spec points where it
# produced 129 does not crash — it quietly seeds a worse curriculum, which shows
# up weeks later as a student missing half their topics.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile so CI fails on a lockfile that drifted from
      # package.json, rather than silently resolving different versions than
      # the ones that were actually tested locally.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pypdf is PINNED, and the pin is load-bearing. Layout-mode extraction is
      # pypdf's own algorithm, so its output moves between releases: on the
      # latest, five specifications come out with different statement text and
      # OCR Biology A regains the guidance-column bleed that parse_ocr.py exists
      # to prevent. The committed seed — and the curriculum in the live database
      # — was produced by 5.9.0, so that is what reproduces it. Moving the pin is
      # a deliberate act: bump it, regenerate, read the diff, commit both.
      #
      # cryptography is not optional despite the parsers never importing it:
      # several of the board PDFs are AES-encrypted (owner password set, no user
      # password), and pypdf raises DependencyError decrypting them without it.
      # It went unnoticed locally because another package had already pulled it
      # in — this CI run on a clean machine is what surfaced it.
      - name: Install parser dependencies
        run: pip install --quiet "pypdf==5.9.0" cryptography

      # ~70s: it parses all seventeen specification PDFs and checks each one
      # still reproduces its committed seed. Slower than the rest of the file
      # put together, and worth it — this is the check that catches a board
      # reissuing a spec under us.
      - name: Curriculum parsers reproduce the committed seed
        run: python3 test_seed_matches.py
        working-directory: scripts/curriculum
